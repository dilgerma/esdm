properties:
    scope:
        type: object
        properties:
            domain:
                type: string
                pattern: "^[a-z][a-z0-9-]*$"
        required: [domain]
        additionalProperties: false
    timelines:
        type: array
        minItems: 1
        items:
            type: object
            properties:
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9-]*$"
                description:
                    type: string
                boundedContext:
                    type: string
                    pattern: "^[a-z][a-z0-9-]*$"
                slices:
                    type: array
                    minItems: 1
                    items:
                        type: string
                        pattern: "^[a-z][a-z0-9-]*$"
            required: [name, boundedContext, slices]
            additionalProperties: false
required: [scope, timelines]
